<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CarBug | داشبورد عیب‌یابی خودرو</title>
<meta name="description" content="مرجع فارسی تشخیص ایراد خودرو از روی صدا، بو و دود">
<meta name="theme-color" content="#0a1120">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/icons/icon-192.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/vazirmatn@33.0.3/Vazirmatn-font-face.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app">
<nav class="side" aria-label="ناوبری">
<div class="logo" dir="ltr"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M4 23a12 12 0 1 1 24 0" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"/><path d="M9 21l4-5 3 3 6-8" fill="none" stroke="var(--acc)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg><span>CarBug</span></div>
<button data-v="lib" class="on"><i>📋</i><span>عیب‌ها</span></button>
<button data-v="wiz"><i>🩺</i><span>عیب‌یاب</span></button>
<button data-v="lights"><i>🚦</i><span>چراغ‌ها</span></button>
<button data-v="saved"><i>⭐</i><span>ذخیره‌ها</span></button>
<button id="theme" class="tbtn" aria-label="تغییر تم"><i>🌓</i><span>تم</span></button>
</nav>
<div class="content">
<header class="topbar"><input type="search" id="q" placeholder="جستجو: «ترمز»، «جیغ»، «دود سفید»…" aria-label="جستجو"></header>
<main>
<section id="v-lib" class="view">
<div class="stats" id="stats"></div>
<div class="hero">
<div class="panel"><h2>نقشه‌ی محل صدا</h2>
<svg viewBox="0 0 420 150" role="group" aria-label="نقشه‌ی خودرو">
<path d="M15 112V88Q60 78 105 66L160 40H290L350 66L405 86V112Z" fill="none" stroke="currentColor" stroke-width="2"/>
<rect class="z" data-z="front" tabindex="0" role="button" aria-label="جلو و موتور" x="18" y="68" width="100" height="40" rx="6"/><text x="68" y="92">موتور و جلو</text>
<rect class="z" data-z="cabin" tabindex="0" role="button" aria-label="کابین" x="124" y="44" width="160" height="38" rx="6"/><text x="204" y="67">کابین و کولر</text>
<rect class="z" data-z="under" tabindex="0" role="button" aria-label="زیر و عقب" x="124" y="86" width="270" height="22" rx="6"/><text x="259" y="101">زیر خودرو، گیربکس و اگزوز</text>
<circle class="z" data-z="wheel" tabindex="0" role="button" aria-label="چرخ‌ها" cx="75" cy="115" r="22"/><circle class="z" data-z="wheel" tabindex="0" role="button" aria-label="چرخ‌ها" cx="335" cy="115" r="22"/><text x="75" y="119">چرخ</text><text x="335" y="119">چرخ</text>
<rect class="z" data-z="smoke" tabindex="0" role="button" aria-label="بو و دود" x="320" y="12" width="90" height="22" rx="11"/><text x="365" y="27">بو و دود</text>
</svg></div>
<div class="panel"><h2>فیلترها</h2>
<div class="chips" id="cats"><b>دسته</b></div>
<div class="chips" id="types"><b>صدا</b></div>
<div class="chips" id="mods"><b>خودرو</b></div></div>
</div>
<div class="row"><span id="count"></span><select id="sort" aria-label="مرتب‌سازی"><option value="0">ترتیب پیش‌فرض</option><option value="1">خطرناک‌ترین اول</option></select></div>
<div id="list" class="grid"></div>
</section>
<section id="v-wiz" class="view" hidden><h2>عیب‌یاب مرحله‌ای</h2><div id="wb"></div></section>
<section id="v-lights" class="view" hidden><h2>چراغ‌های داشبورد</h2><div id="lb" class="grid"></div></section>
<p class="note">این فهرست فقط راهنما است و جایگزین مکانیک یا دستگاه دیاگ نیست. لینک‌های صدا جستجو در سایت‌های بیرونی‌اند.</p>
</main>
</div>
</div>
<div id="cbar" hidden><button class="btn" id="go"></button><button class="btn ghost" id="clr">پاک‌کردن</button></div>
<dialog id="dlg"><button class="btn ghost" id="close">بستن</button><div class="tw" id="tbl"></div></dialog>
<script src="data/faults.js"></script>
<script src="data/lights.js"></script>
<script src="js/app.js"></script>
</body>
</html>
